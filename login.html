<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Star Chicken Login</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f6f8;font-family:Arial,sans-serif}
    .card{width:min(420px,92vw);background:#fff;border-radius:18px;padding:32px;box-shadow:0 12px 40px rgba(0,0,0,.12)}
    h1{margin:0 0 8px}.muted{color:#667085;margin:0 0 24px}input{width:100%;padding:13px;border:1px solid #d0d5dd;border-radius:10px;font-size:16px}
    button{width:100%;margin-top:14px;padding:13px;border:0;border-radius:10px;background:#1f6feb;color:white;font-size:16px;cursor:pointer}
    #msg{margin-top:14px;color:#b42318;min-height:20px}
  </style>
</head>
<body>
  <div class="card">
    <h1>Star Chicken</h1>
    <p class="muted">Invoice system login</p>
    <form id="form">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password" autofocus>
      <button>Login</button>
      <div id="msg"></div>
    </form>
  </div>
<script>
document.getElementById('form').addEventListener('submit', async e => {
  e.preventDefault();
  const msg = document.getElementById('msg');
  msg.textContent = '';
  try {
    const r = await fetch('/login', {
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:document.getElementById('password').value})
    });
    const data = await r.json();
    if (!r.ok) throw new Error(data.error || 'Login failed');
    location.href = '/';
  } catch(err) {
    msg.textContent = err.message;
  }
});
</script>
</body>
</html>
